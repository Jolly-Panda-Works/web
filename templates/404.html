<!DOCTYPE html>
<html data-root="/" dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{title}}</title>
<meta content="{{description}}" name="description"/>
<meta content="#fdfaf5" name="theme-color"/>
<meta content="{{robots}}" name="robots"/>
<meta content="Jolly Panda Studio" name="author"/>
<link href="{{root}}assets/logo/favicon.ico" rel="icon" sizes="any"/>
<link href="{{root}}assets/logo/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="{{root}}assets/logo/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="{{root}}assets/logo/apple-touch-icon-180.png" rel="apple-touch-icon"/>
<link href="{{root}}manifest.json" rel="manifest"/>
<!-- Fonts: Inter (Latin) + Vazirmatn (Persian) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="{{root}}css/variables.css" rel="stylesheet"/>
<link href="{{root}}css/style.css" rel="stylesheet"/>
<link href="{{root}}css/responsive.css" rel="stylesheet"/>
<link href="{{root}}css/site.css" rel="stylesheet"/>
</head>
<body data-page="notfound" dir="ltr">
{{> header}}
<!-- ============ 404 ============ -->
<main id="main">
<section class="notfound">
<div class="container notfound__inner">
<picture>
<source srcset="{{root}}assets/images/404-panda.webp" type="image/webp"/>
<img alt="" class="notfound__img" data-i18n-attr="alt:notFound.imageAlt" height="500" src="{{root}}assets/images/404-panda.png" width="500"/>
</picture>
<h1 class="notfound__title" data-i18n="notFound.title">Page not found</h1>
<p class="notfound__text" data-i18n="notFound.text">The page you're looking for has moved, been renamed, or never existed.</p>
<div class="notfound__actions">
<a class="btn btn-primary" data-i18n="notFound.primary" href="{{base}}index.html">Back to home</a>
<a class="btn btn-secondary" data-i18n="notFound.secondary" href="{{base}}packages.html#packages">Choose a package</a>
</div>
</div>
</section>
</main>
{{> footer}}
<script defer="" src="{{root}}js/app.js"></script>
<script defer="" src="{{root}}js/notfound.js"></script>
</body>
</html>
