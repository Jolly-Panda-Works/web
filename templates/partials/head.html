<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{title}}</title>
<meta content="{{description}}" name="description"/>
<meta content="{{keywords}}" name="keywords"/>
<meta content="#fdfaf5" name="theme-color"/>
<meta content="{{robots}}" name="robots"/>
<meta content="Jolly Panda Studio" name="author"/>
<!-- Open Graph / Twitter -->
<meta content="{{title}}" property="og:title"/>
<meta content="{{description}}" property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="{{canonical}}" property="og:url"/>
<meta content="{{site_name}}" property="og:site_name"/>
<meta content="{{og_locale}}" property="og:locale"/>
<meta content="{{og_locale_alt}}" property="og:locale:alternate"/>
<meta content="{{site_url}}/assets/social/og-image.png" property="og:image"/>
<meta content="1200" property="og:image:width"/>
<meta content="630" property="og:image:height"/>
<meta content="{{t:og.alt}}" property="og:image:alt"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="{{title}}" name="twitter:title"/>
<meta content="{{description}}" name="twitter:description"/>
<meta content="{{site_url}}/assets/social/og-image.png" name="twitter:image"/>
<!-- Icons — generated from the official paw logo -->
<link href="{{root}}assets/logo/favicon.ico" rel="icon" sizes="any"/>
<link href="{{root}}assets/logo/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="{{root}}assets/logo/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="{{root}}assets/logo/apple-touch-icon-180.png" rel="apple-touch-icon"/>
<link href="{{root}}manifest.json" rel="manifest"/>
<link href="{{canonical}}" rel="canonical"/>
<link href="{{url_en}}" hreflang="en" rel="alternate"/>
<link href="{{url_fa}}" hreflang="fa" rel="alternate"/>
<link href="{{url_en}}" hreflang="x-default" rel="alternate"/>
<!-- Fonts: Inter (Latin) + Vazirmatn (Persian) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="{{root}}css/variables.css" rel="stylesheet"/>
<link href="{{root}}css/style.css" rel="stylesheet"/>
<link href="{{root}}css/responsive.css" rel="stylesheet"/>
<link href="{{root}}css/site.css" rel="stylesheet"/>
<script type="application/ld+json">
{{jsonld}}
</script>
